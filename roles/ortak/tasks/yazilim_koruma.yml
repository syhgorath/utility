# Yazılım koruması (nginx/mariadb/redis): tek mod, sabit sürüm, yönetilmeyen paket. Salt okunur, --check'te de çalışır. Sonuç: k_kurulu, k_yukseltme (yukseltme gerekli mi).
- name: Read the recorded state
  ansible.builtin.set_fact:
    k_kurulu: "{{ k_yz in (k_isaret.yazilimlar | default({})) }}"
    k_kayit_eski: "{{ (k_isaret.yazilimlar | default({})).get(k_yz, {}) }}"

# Sabit hedefli eylemler (<yz>_*) kurulu uygulamayı YÖNETİR: kurulum_<yz>_mod 'otomatik' iken kurulu mod korunur (genel kurulum_mod yalnız yeni kurulumda).
# Uygulama başına mod açıkça farklıysa aşağıdaki tek mod denetimi reddeder. kaldir'de de uygulama başına mod seçilmişse kurulu mod esas alınır (kaldırma mod değiştirmez).
- name: Fixed-target actions keep the installed mode
  ansible.builtin.set_fact:
    k_mod: "{{ k_kayit_eski.mod }}"
    k_surum: "{{ 'dagitim' if k_kayit_eski.mod == 'native' else (k_ozel.split(':')[1] if k_ozel != '' else k_surum_secili) }}"
  when: >-
    k_kurulu and ((k_sabit_yz is defined and k_mod_istek == 'otomatik') or (kurulum_islem == 'kaldir' and k_mod_istek != 'otomatik'))

- name: Is the package installed?
  ansible.builtin.shell: "dpkg-query -W -f='${db:Status-Abbrev}' {{ k_katalog.paket }} 2>/dev/null | grep -q '^ii' && echo 1 || echo 0"
  args:
    executable: /bin/bash
  register: kurulum_paket_var
  changed_when: false
  check_mode: false
  when: k_katalog.paket != ''

- name: Stop on one-mode-per-software violation
  ansible.builtin.assert:
    that: not k_kurulu or k_kayit_eski.mod == k_mod
    fail_msg: >-
      kurulum: {{ k_yz }} bu sunucuda zaten '{{ k_kayit_eski.mod | default('') }}' modunda kurulu; istenen '{{ k_mod }}'. Bir yazılım için tek mod vardır.
      Önce kaldir eylemiyle kaldırın (veri silinmez), sonra istediğiniz modda kurun.
    quiet: true

- name: Stop on an unmanaged native package
  ansible.builtin.assert:
    that: k_mod != 'native' or k_kurulu or kurulum_paket_var.stdout == '0' or (kurulum_islem == 'kaldir')
    fail_msg: >-
      kurulum: {{ k_katalog.paket }} paketi bu sunucuda zaten kurulu ama kurulum tarafından yönetilmiyor (işaret dosyasında kaydı yok).
      Mevcut kurulumunuza dokunmamak için durduruldu; elle devralmak v0.1'de yok.
    quiet: true

- name: Detect a version change (docker mode)
  ansible.builtin.set_fact:
    k_yukseltme: "{{ k_kurulu and k_mod == 'docker' and k_kayit_eski.surum | default('') != k_surum }}"

- name: kur never changes the image tag silently
  ansible.builtin.assert:
    that: not k_yukseltme or ansible_check_mode or (k_yukselt_modu | default(false) | bool)
    fail_msg: >-
      kurulum: {{ k_yz }} sunucuda {{ k_kayit_eski.surum | default('') }} sürümünde; istenen {{ k_surum }}. kur sürümü sessizce değiştirmez.
      Yükseltme için {{ k_sabit_yz ~ '_yukselt' if k_sabit_yz is defined else 'yukselt' }} eylemini kullanın (öncesinde döküm alır, geri düşürme yoktur).
    quiet: true
  when: kurulum_islem == 'kur'

# --- Ağ erişimi: istenen değer + sunucudaki kayıt -> bu koşunun erişimi (k_erisim), bağlama adresi (k_bind), yayınlanan port (k_port; iç ağda 0) ---
# otomatik: kurulu uygulama bugünkü davranışını korur (kayıtta 'ic' ise iç ağda kalır; değilse kurulum_dis_erisim'e göre sunucu/agdan).
# Yalnız YENİ docker mariadb/redis iç ağda başlar.
- name: Resolve the network access
  ansible.builtin.set_fact:
    k_erisim: >-
      {{ k_istek if k_istek != 'otomatik'
         else ('ic' if k_kurulu and k_mod == 'docker' and k_kayit_eski.erisim | default('') == 'ic'
         else ('agdan' if kurulum_dis_erisim | bool
         else ('ic' if not k_kurulu and k_mod == 'docker' and k_yz in ['mariadb', 'redis'] else 'sunucu'))) }}
  vars:
    k_istek: "{{ lookup('vars', 'kurulum_' ~ k_yz ~ '_erisim') }}"
  when: k_yz != 'proxy'

- name: Native software cannot be limited to the docker network
  ansible.builtin.assert:
    that: not (k_mod == 'native' and k_erisim == 'ic')
    fail_msg: >-
      kurulum: 'yalnız iç ağ' (kurulum_{{ k_yz }}_erisim=ic) yalnız docker modunda anlamlıdır; native serviste 'sunucu' (127.0.0.1) ya da 'agdan' seçin.
      Hiçbir şey değiştirilmedi.
    quiet: true
  when: kurulum_islem in ['kur', 'yukselt']

- name: Derive the bind address and the published port
  ansible.builtin.set_fact:
    k_bind: "{{ {'ic': '', 'sunucu': '127.0.0.1', 'agdan': '0.0.0.0'}[k_erisim] }}"
    k_port: "{{ 0 if k_erisim == 'ic' else k_port | int }}"
  when: k_yz != 'proxy'

# Nginx Proxy Manager: 80/443 her zaman ağa açık; yalnız yönetim ekranının (81) yayını seçilir. 'otomatik' kararı sunucunun adreslerinden verilir
# (files/yonetim_karari.py, salt okunur); elle agdan/sunucu seçimi her zaman üstündür, adresler o zaman yalnız uyarı için okunur.
- name: Read the server addresses for the proxy admin port
  ansible.builtin.command:
    argv: ["{{ ansible_facts.python.executable }}", -I, "-"]
    stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../roles/proxy/files/yonetim_karari.py') }}"
  register: kurulum_proxy_adres
  changed_when: false
  failed_when: false
  check_mode: false
  when: k_yz == 'proxy' and kurulum_islem != 'kaldir'

- name: Resolve the proxy publish (80/443 public, admin port selectable)
  ansible.builtin.set_fact:
    k_erisim: agdan
    k_bind: "0.0.0.0"
    k_port: 80
    k_p_adres: "{{ k_p_okunan }}"
    k_yonetim: "{{ k_p_secim }}"
    k_yonetim_bind: "{{ {'agdan': '0.0.0.0', 'sunucu': '127.0.0.1'}[k_p_secim] }}"
  vars:
    # betik koşamazsa güvenli yön: sunucu
    k_p_okunan: >-
      {{ (kurulum_proxy_adres.stdout | from_json) if kurulum_proxy_adres.rc | default(1) == 0 and kurulum_proxy_adres.stdout | default('') | trim != ''
         else {'karar': 'sunucu', 'genel': none, 'neden': 'adres okuması çalışmadı; güvenli yön seçildi'} }}
    k_p_secim: >-
      {{ (k_kayit_eski.yonetim | default('sunucu')) if kurulum_islem == 'kaldir'
         else (k_p_okunan.karar if kurulum_proxy_yonetim == 'otomatik' else kurulum_proxy_yonetim) }}
  when: k_yz == 'proxy'

- name: Explain the proxy admin port decision
  ansible.builtin.debug:
    msg: >-
      kurulum: proxy yönetim erişimi: {{ 'otomatik -> ' ~ k_yonetim ~ ' (' ~ k_p_adres.neden ~ ')' if kurulum_proxy_yonetim == 'otomatik'
      else k_yonetim ~ ' (elle seçildi)' }}
  when: k_yz == 'proxy' and kurulum_islem != 'kaldir'

- name: Warn that the admin port is opened on a server with a public address
  ansible.builtin.debug:
    msg: >-
      kurulum: UYARI yönetim ekranı (81) elle 'agdan' seçildi ve {{ 'sunucuda genel IPv4 adresi var (' ~ (k_p_adres.genel[:3] | join(', ')) ~ '): 81 İNTERNETE AÇIK olur'
      if k_p_adres.genel else 'sunucunun adresleri okunamadı: 81 internete açık olabilir' }}. ufw engellemez. İstemiyorsanız kurulum_proxy_yonetim=sunucu ya da otomatik seçin.
  when: >-
    k_yz == 'proxy' and kurulum_islem != 'kaldir' and kurulum_proxy_yonetim == 'agdan' and (k_p_adres.genel is none or k_p_adres.genel | length > 0)

- name: Warn about an admin port change of the installed proxy
  ansible.builtin.debug:
    msg: >-
      kurulum: DEĞİŞECEK proxy yönetim erişimi {{ k_kayit_eski.yonetim | default('?') }} -> {{ k_yonetim }}. Değer verilmeyen değişken varsayılanına döner
      (otomatik: sunucunun adreslerine göre); konteyner yeniden yaratılır (kısa kesinti).
  when: k_yz == 'proxy' and k_kurulu and kurulum_islem != 'kaldir' and k_kayit_eski.yonetim | default('') != k_yonetim

# Kurulu uygulamada yayın değişecekse söylenir: değer verilmeyen değişken VARSAYILANA döner (ör. port 8080), önizlemede görülsün
- name: Warn about publish changes to an installed application
  ansible.builtin.debug:
    msg: >-
      kurulum: DEĞİŞECEK {{ k_yz }}: port {{ k_kayit_eski.port | default(0) }} -> {{ k_port }}, erişim {{ k_eski_erisim }} -> {{ k_erisim }}.
      Değer verilmeyen değişken varsayılanına döner.
  vars:
    k_eski_erisim: >-
      {{ k_kayit_eski.erisim | default({'0.0.0.0': 'agdan', '127.0.0.1': 'sunucu', '': 'ic'}[k_kayit_eski.bind | default('')] | default('sunucu')) }}
  when: >-
    k_kurulu and kurulum_islem != 'kaldir' and
    (k_kayit_eski.port | default(0) | int != k_port | int or k_eski_erisim != k_erisim)

# --- İç ağ adı: gerçek kaynak sunucudaki işaret (alan yoksa 'kurulum'). Docker uygulaması kuruluyken ad değiştirilemez. ---
- name: Read the recorded docker network
  ansible.builtin.set_fact:
    k_ag_kayitli: "{{ k_isaret.docker_ag | default('kurulum') }}"
    k_docker_uygulamalar: "{{ k_isaret.yazilimlar | default({}) | dict2items | selectattr('value.mod', 'equalto', 'docker') | map(attribute='key') | list }}"

- name: Refuse a network rename while docker applications exist
  ansible.builtin.assert:
    that: k_docker_uygulamalar | length == 0 or k_ag_kayitli == kurulum_docker_ag
    fail_msg: >-
      kurulum: ağ adı değiştirilemez. Sunucuda docker uygulamaları ({{ k_docker_uygulamalar | join(', ') }}) '{{ k_ag_kayitli }}' ağında kurulu; istenen
      '{{ kurulum_docker_ag }}'. kurulum_docker_ag değerini '{{ k_ag_kayitli }}' yapın ya da önce bu uygulamaları kaldir ile kaldırın (veri silinmez).
      Hiçbir şey değiştirilmedi.
    quiet: true
  when: k_mod == 'docker' and kurulum_islem in ['kur', 'yukselt']

- name: Inspect an existing network with that name
  ansible.builtin.command: "docker network inspect -f '{% raw %}{{.Driver}}{% endraw %}' {{ kurulum_docker_ag }}"
  register: kurulum_ag_surucu
  changed_when: false
  failed_when: false
  check_mode: false
  when: k_mod == 'docker' and kurulum_islem in ['kur', 'yukselt'] and kurulum_docker_durum in ['resmi', 'dagitim']

- name: Refuse a network that is not a bridge network
  ansible.builtin.assert:
    that: kurulum_ag_surucu.stdout | trim == 'bridge'
    fail_msg: >-
      kurulum: '{{ kurulum_docker_ag }}' adlı docker ağı zaten var ve bridge türünde değil ({{ kurulum_ag_surucu.stdout | trim }}). Başka bir ad seçin.
      Hiçbir şey değiştirilmedi.
    quiet: true
  when: kurulum_ag_surucu.rc | default(1) == 0

# docker modunda kur/yukselt istenen adı kullanır (yukarıda doğrulandı); diğer her şey kayıtlı adı korur
- name: Decide the network name to record
  ansible.builtin.set_fact:
    k_docker_ag: "{{ kurulum_docker_ag if k_mod == 'docker' and kurulum_islem in ['kur', 'yukselt'] else k_ag_kayitli }}"

- name: Warn that moving into the docker network removes the published port
  ansible.builtin.debug:
    msg: >-
      kurulum: UYARI {{ k_yz }} şu an {{ k_kayit_eski.bind }}:{{ k_kayit_eski.port }} üzerinde yayınlı; iç ağa alınınca yayın kalkar ve konteyner yeniden yaratılır.
      Sunucudan bu adresle bağlananlar kopar.
  when: k_erisim == 'ic' and k_kurulu and k_kayit_eski.bind | default('') != '' and kurulum_islem != 'kaldir'

- name: Note the reach of an internal-only application
  ansible.builtin.debug:
    msg: >-
      kurulum: {{ k_yz }} yalnız iç ağda: port yayınlanmaz. '{{ k_docker_ag }}' ağındaki konteynerler (hepsi) ve bu sunucunun kendisi (konteyner IP'si ile) erişebilir.
  when: k_erisim == 'ic' and kurulum_islem != 'kaldir'

# ufw uyarısı moda göre: Docker'ın yayınladığı port ufw kurallarına takılmaz; native serviste ufw kuralı erişimi belirler.
- name: Warn that ufw does not filter a docker-published port
  ansible.builtin.debug:
    msg: >-
      kurulum: UYARI dış erişim açık ({{ k_bind }}:{{ k_port }}). Docker'ın yayınladığı port ufw kurallarına TAKILMAZ: ufw 'deny incoming' olsa bile bu port
      ağdaki herkese açıktır ve ufw kuralı eklemek erişimi kısıtlamaz. Kısıtlamak için kurulum_{{ k_yz }}_erisim=sunucu ya da ic seçin (veya sunucunun önünde
      ayrı bir güvenlik duvarı kullanın).
  when: k_erisim == 'agdan' and k_mod == 'docker' and k_yz != 'proxy' and kurulum_islem != 'kaldir'

- name: Warn about the public proxy ports
  ansible.builtin.debug:
    msg: >-
      kurulum: UYARI proxy 80 ve 443 portlarını ağa açar. Docker'ın yayınladığı port ufw kurallarına TAKILMAZ: ufw 'deny incoming' olsa bile bu portlar açıktır.
  when: k_yz == 'proxy' and kurulum_islem != 'kaldir'

- name: Warn about the proxy admin port and the first login
  ansible.builtin.debug:
    msg: >-
      {{ 'kurulum: UYARI yönetim ekranı (81) sunucunun TÜM ağ arayüzlerinde açık ve ufw onu engellemez; sunucu internetten erişilebiliyorsa 81 de erişilebilir.
      NAT arkasındaki bulut sunucusu algılanmaz. 81 portunu internete yönlendirmeyin; emin değilseniz kurulum_proxy_yonetim=sunucu seçin.' if k_yonetim == 'agdan'
      else 'kurulum: yönetim ekranı yalnız sunucunun kendisinde (127.0.0.1:81). Erişim için SSH tüneli: ssh -L 8181:127.0.0.1:81 <kullanıcı>@<sunucu>, sonra http://127.0.0.1:8181' }}
      İLK GİRİŞ: kurulumdan HEMEN SONRA yönetim ekranını açıp yönetici hesabını güçlü bir parolayla oluşturun. Hesap oluşturulana kadar ekrana ulaşan HERKES
      (ortak docker ağındaki konteynerler dahil) yöneticiyi kendisi oluşturabilir. Bu paket parola üretmez, istemez ve NPM'ye giriş yapmaz.
  when: k_yz == 'proxy' and kurulum_islem != 'kaldir'

- name: Show the ufw suggestion for an exposed native service
  ansible.builtin.debug:
    msg: >-
      kurulum: dış erişim açık ({{ k_bind }}:{{ k_port }}). ufw'ye YAZILMAZ (tek sahibi linux-hardening). Öneri: servers/<ad>/linux-hardening.vars içinde
      hardening_ufw_extra_allow_host listesine 'from <yönetim ağı> to any port {{ k_port }} proto tcp' ekleyin ('any' kaynak vermeyin).
  when: k_erisim == 'agdan' and k_mod == 'native' and kurulum_islem != 'kaldir'

