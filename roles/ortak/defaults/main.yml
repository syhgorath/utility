# Ortak varsayılanlar (component.json vars ile aynı). Playbook'lar bu dosyayı vars_files ile yükler (include_role varsayılanları sonraki görevlere açmaz);
# sshpocket değerleri -e ile verir ve bunların üstündedir.
kurulum_yazilim: "docker"           # docker | nginx | mariadb | redis | proxy | redisui
kurulum_mod: "native"               # native | docker (yazilim=docker iken yok sayılır)
kurulum_ana_klasor: "/srv/homelab"
# Uygulama başına mod: otomatik = genel kurulum_mod. Kurulu uygulamanın modu değiştirilemez (kaldir + kur).
kurulum_nginx_mod: "otomatik"       # otomatik | native | docker
kurulum_mariadb_mod: "otomatik"
kurulum_redis_mod: "otomatik"
kurulum_docker_kaynak: "resmi"      # resmi (download.docker.com apt deposu) | dagitim (docker.io)
kurulum_docker_ag: "kurulum"        # docker uygulamalarının ortak ağı; docker uygulaması kuruluyken değiştirilemez (gerçek kaynak sunucudaki işaret)
kurulum_dis_erisim: false           # eski genel seçim; yalnız kurulum_<yz>_erisim=otomatik iken etkili: false = 127.0.0.1; true = 0.0.0.0 (ufw'ye YAZILMAZ)
# Uygulama başına ağ erişimi: otomatik | ic (yalnız iç ağ, port yayınlanmaz; yalnız docker) | sunucu (127.0.0.1) | agdan (0.0.0.0). Çözümleme: yazilim_koruma.yml
kurulum_nginx_erisim: "otomatik"
kurulum_mariadb_erisim: "otomatik"
kurulum_redis_erisim: "otomatik"
kurulum_nginx_port: 8080
kurulum_nginx_surum: "1.30.6"
kurulum_nginx_imaj_ozel: ""
kurulum_mariadb_port: 3306
kurulum_mariadb_surum: "11.4.13"
kurulum_mariadb_imaj_ozel: ""
kurulum_redis_port: 6379
kurulum_redis_surum: "7.4.12"
kurulum_redis_imaj_ozel: ""
# Nginx Proxy Manager (yalnız docker). Portları sabittir: 80 ve 443 her zaman ağa açık, yönetim ekranı 81.
# yönetim ekranı (81): agdan (0.0.0.0) | sunucu (127.0.0.1) | otomatik (genel IPv4 adresi varsa ya da adres okunamazsa sunucu, yoksa agdan)
kurulum_proxy_yonetim: "otomatik"
kurulum_proxy_surum: "2.17.1"
# Redis Insight (yalnız docker; bu paketin kurduğu docker Redis'e bağlanır). Ağa açma seçeneği YOKTUR: kendi girişi yok.
kurulum_redisui_erisim: "ic"        # ic (port yayınlanmaz) | sunucu (127.0.0.1)
kurulum_redisui_surum: "3.10.2"
kurulum_redisui_port: 5540          # erisim=sunucu iken 127.0.0.1'deki port (manifest değişkeni değil)

# İç değerler
kurulum_supported_os: { Ubuntu: ["26.04"] }
kurulum_planned_os: { Debian: ["13"] }
kurulum_surumi: "0.1.0"
kurulum_saat_esigi_sn: 3600          # sunucu/kontrol makinesi saat farkı bunu aşarsa UYARI (koşu durmaz)
kurulum_kilit: /run/kurulum.lock
kurulum_yasak_kokler: ["/", "/etc", "/usr", "/bin", "/sbin", "/lib", "/lib64", "/boot", "/dev", "/proc", "/sys", "/run", "/var", "/root", "/home", "/tmp", "/opt", "/srv", "/mnt", "/media", "/snap"]
kurulum_yasak_onekler: ["/etc/", "/usr/", "/bin/", "/sbin/", "/lib/", "/lib64/", "/boot/", "/dev/", "/proc/", "/sys/", "/run/", "/var/lib/docker", "/tmp/", "/snap/"]
# Küratörlü sürümler (artan sıra; paket sürümüyle gelir). latest YOKTUR.
kurulum_katalog:
  nginx:
    imaj: nginx
    konteyner_port: 80
    paket: nginx
    servis: nginx
    gizli: []
    surumler: ["1.30.6", "1.31.8"]
    native_veri: /var/www/html
  mariadb:
    imaj: mariadb
    konteyner_port: 3306
    paket: mariadb-server
    servis: mariadb
    gizli: [MARIADB_ROOT_PASSWORD]
    surumler: ["10.11.19", "11.4.13", "11.8.9"]
    native_veri: /var/lib/mysql
  redis:
    imaj: redis
    konteyner_port: 6379
    paket: redis-server
    servis: redis-server
    gizli: [REDIS_PASSWORD]
    surumler: ["7.2.17", "7.4.12", "8.2.11", "8.4.8"]
    native_veri: /var/lib/redis
  proxy:
    imaj: jc21/nginx-proxy-manager
    konteyner_port: 80
    paket: ""                         # native modu yok
    servis: ""
    gizli: []                         # parola üretilmez: yönetici hesabını kullanıcı NPM ekranında oluşturur
    surumler: ["2.17.0", "2.17.1"]
    native_veri: ""
    portlar: [80, 443, 81]            # hepsi boş olmalı
    ek_dizinler: [letsencrypt]        # <ana>/proxy/ altında data/ dışında
    saglik_deneme: 100                # ilk açılış dakikalar sürebilir (3 sn aralıkla)
    baglanti_anahtari: false          # ortak .env'e <YZ>_HOST/PORT yazılmaz
  redisui:
    imaj: redis/redisinsight
    konteyner_port: 5540
    paket: ""                         # native modu yok
    servis: ""
    gizli: [RI_ENCRYPTION_KEY]        # sunucuda üretilir, yükseltme ve yeniden kurulumda korunur
    surumler: ["3.10.1", "3.10.2"]
    native_veri: ""
    hazirlik: true                    # roles/redisui/tasks/hazirlik.yml: veri sahibi ve Redis parolası
    saglik_deneme: 60
    baglanti_anahtari: false
# genel özetin kurulu/portlar listelerine GİRMEYEN uygulamalar: o değerler 64 karakterde kesilir ve dolu (README "Sonuç satırı sınırı")
kurulum_ozet_disi: [proxy, redisui]
# native modu olmayan uygulamalar: genel kurulum_mod uygulanmaz
kurulum_yalniz_docker: [proxy, redisui]
