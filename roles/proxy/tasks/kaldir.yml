# Kaldır: veriye dokunmaz (<ana>/proxy/data ve letsencrypt/ kalır: yönlendirmeler, hesap ve sertifikalar durur).
- name: Remove docker mode
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/ortak/tasks/docker_uygulama_kaldir.yml"
  when: k_kurulu

