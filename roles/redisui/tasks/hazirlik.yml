# Konteyner başlamadan: veri dizini imajın kullanıcısına (uid 1000) verilir; Redis parolası sunucudaki redis/.env'den redisui/.env'e (0600) kopyalanır.
# Parola SUNUCUDAN ÇIKMAZ: değer Ansible'a döndürülmez, komut satırı argümanı olmaz, compose dosyasına yazılmaz.
- name: Give the data directory to the image user (uid 1000)
  ansible.builtin.file:
    path: "{{ k_ana }}/redisui/data"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0700"
  register: kd_redisui_veri

# --check'te yalnız karşılaştırır (KURU=1), yazmaz
- name: Copy the Redis password into the Redis Insight environment file
  ansible.builtin.shell: |
    set -eu
    umask 077
    kaynak='{{ k_ana }}/redis/.env'
    hedef='{{ k_ana }}/redisui/.env'
    deger=$(sed -n 's/^REDIS_PASSWORD=//p' "$kaynak" | head -n1)
    [ -n "$deger" ] || { echo "redis parolasi yok" >&2; exit 1; }
    # printf kabuk içi komuttur: değer süreç listesine düşmez
    if [ -f "$hedef" ] && printf 'RI_REDIS_PASSWORD=%s\n' "$deger" | grep -qxF -f - "$hedef"; then echo ayni; exit 0; fi
    if [ "$KURU" = 1 ]; then echo yazilacak; exit 0; fi
    { grep -v '^RI_REDIS_PASSWORD=' "$hedef" 2>/dev/null || true; printf 'RI_REDIS_PASSWORD=%s\n' "$deger"; } > "$hedef.yeni"
    chmod 600 "$hedef.yeni"
    mv "$hedef.yeni" "$hedef"
    echo yazildi
  args:
    executable: /bin/bash
  environment:
    KURU: "{{ '1' if ansible_check_mode else '0' }}"
  register: kd_env_ek
  changed_when: kd_env_ek.stdout | default('') in ['yazildi', 'yazilacak']
  check_mode: false
