# Ortak ön kontrol: işletim sistemi + değişken biçimleri. Hiçbir şey değiştirmez; --check'te de çalışır.
- name: Read OS identity
  ansible.builtin.set_fact:
    utility_os_name: "{{ ansible_facts['distribution'] }}"
    utility_os_version: "{{ ansible_facts['distribution_version'] }}"

- name: Fail on unsupported OS
  ansible.builtin.assert:
    that:
      - >-
        (utility_supported_os.get(utility_os_name, []) + utility_planned_os.get(utility_os_name, []))
        | select('in', [utility_os_version, utility_os_version.split('.')[0]]) | list | length > 0
    fail_msg: >-
      utility: desteklenmeyen sistem ({{ utility_os_name }} {{ utility_os_version }}). v0.1 yalnızca Ubuntu 26.04 ve Debian 13 destekler.
      Proxmox VE ve Raspberry Pi kapsam dışıdır.
    quiet: true

# Proxmox VE 9 Debian 13 tabanlıdır ve ansible_facts'te "Debian" görünür: OS eşlemesi onu yakalayamaz. --check'te de çalışır (yalnızca okur).
- name: Detect Proxmox VE
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: [/usr/bin/pveversion, /etc/pve]
  register: utility_pve
  check_mode: false

- name: Refuse Proxmox VE
  ansible.builtin.assert:
    that: utility_pve.results | selectattr('stat.exists') | list | length == 0
    fail_msg: >-
      utility: Proxmox VE tespit edildi (/usr/bin/pveversion ya da /etc/pve var). Proxmox VE v0.1 kapsam dışıdır; hiçbir şey değiştirilmedi.
    quiet: true

- name: Validate variable shapes
  ansible.builtin.assert:
    that:
      - (utility_timezone | default('')) is string
      - (utility_locale | default('')) is string
      - (utility_ntp_servers | default([])) is sequence and (utility_ntp_servers | default([])) is not string
      - (utility_ntp_servers | default([])) | length <= 8
      - utility_backup | bool in [true, false]
      - (utility_timezone | default('')) == '' or (utility_timezone | default('')) is match('^[A-Za-z0-9_+-]+(/[A-Za-z0-9_+-]+){0,2}$')
      - (utility_locale | default('')) == '' or (utility_locale | default('')) is match('^(C|POSIX|C\.UTF-8|[a-z]{2,3}_[A-Z]{2}\.(UTF-8|ISO-8859-[0-9]{1,2}))$')
      - >-
        (utility_ntp_servers | default([])) | reject('match', '^((server|pool) )?[A-Za-z0-9]([A-Za-z0-9.:-]{0,251}[A-Za-z0-9])?$') | list | length == 0
    fail_msg: >-
      utility: değişken biçimi geçersiz. utility_timezone: 'Europe/Istanbul'; utility_locale: 'en_US.UTF-8' (yalnız LANG);
      utility_ntp_servers: en çok 8 satır, her biri 'host', 'server host' ya da 'pool host'.
    quiet: true

- name: Initialise the change plan
  ansible.builtin.set_fact:
    utility_plan: []          # planlanan değişiklik adları (timezone, locale, ntp, paket)
    utility_backup_paths: []  # değişecek yollar; yedeğe yalnızca bunlar girer
