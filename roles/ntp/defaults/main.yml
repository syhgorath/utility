# boş = dağıtım varsayılanı; dosya yazılmaz, chrony kurulmaz
utility_ntp_servers: []
# saat sapması: eşikten büyükse apply TEK SEFERLİK `chronyc makestep` yapar (kalıcı makestep ayarı yazılmaz). false = sapmaya dokunma
utility_ntp_makestep: true
# iç sabitler (manifest değişkeni değil)
utility_ntp_step_threshold_s: 1.0
utility_ntp_step_timeout_s: 60
