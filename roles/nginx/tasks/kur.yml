- name: Docker mode
  when: k_mod == 'docker'
  block:
    - name: Web root
      ansible.builtin.file:
        path: "{{ k_ana }}/nginx/data/www"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: not (ansible_check_mode and kurulum_ana_durum == 'yeni')
    - name: Placeholder page (only when absent; never overwrites your files)
      ansible.builtin.copy:
        dest: "{{ k_ana }}/nginx/data/www/index.html"
        content: "<!doctype html><title>nginx</title><p>kurulum: nginx (docker) çalışıyor.</p>\n"
        force: false
        owner: root
        group: root
        mode: "0644"
      when: not (ansible_check_mode and kurulum_ana_durum == 'yeni')
      register: kd_nginx_sayfa
    - name: Install via Docker
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/ortak/tasks/docker_uygulama_kur.yml"

- name: Native mode
  when: k_mod == 'native'
  block:
    - name: Port 80 must be free for the package post-install start
      ansible.builtin.assert:
        that: kurulum_paket_var.stdout == '1' or 80 not in k_dinlenen
        fail_msg: >-
          kurulum: nginx paketi kurulurken servisi 80 portunda başlatmaya çalışır; 80 şu an dolu (ss). Önce 80'i kullanan süreci durdurun
          ya da docker modunu kullanın. Hiçbir şey kurulmadı.
        quiet: true
    - name: Refresh the index when nginx has no candidate
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/ortak/tasks/apt_aday.yml"
      vars:
        k_apt_paketler: [nginx]
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
      # --check'te indeks bayatsa paket aranamaz (indeks gerçekten yenilenmedi); önizleme "kurulacak" der
      when: not (ansible_check_mode and k_apt_bayat | default(false))
      register: kd_nginx_paket
    - name: Managed site
      ansible.builtin.template:
        src: site.conf.j2
        dest: /etc/nginx/sites-available/kurulum
        owner: root
        group: root
        mode: "0644"
      register: kd_nginx_site
    - name: Enable the managed site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/kurulum
        dest: /etc/nginx/sites-enabled/kurulum
        state: link
      # --check'te paket (ve sites-available) henüz yoksa bağ kurulamaz; önizleme "site + bağ yazılacak" der
      when: not (ansible_check_mode and kd_nginx_site is changed and kurulum_paket_var.stdout == '0')
      register: kd_nginx_bag
    - name: Disable the distribution default site (link only; file stays)
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      register: kd_nginx_varsayilan
    - name: Test the configuration
      ansible.builtin.command: nginx -t
      changed_when: false
      when: not ansible_check_mode
    - name: Enable and start nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started
      when: not ansible_check_mode
      register: kd_nginx_servis
    # Dinlenen adres SUNUCUDAN okunur: reload, aynı portta adres değişince (127.0.0.1 <-> 0.0.0.0) "Address already in use" alır ve eski adreste kalır
    # (komut yine başarılı döner). Dosya doğru ama servis eski adresteyse (ör. önceki sürümün bıraktığı durum) de yeniden başlatılır.
    - name: Read the addresses nginx listens on for this port
      ansible.builtin.shell: set -o pipefail; ss -ltnpH | awk '/"nginx"/ {print $4}' | { grep -E ':{{ k_port }}$' || true; } | sort -u
      args:
        executable: /bin/bash
      register: kurulum_nginx_dinleme
      changed_when: false
      check_mode: false
    - name: Note whether the configuration changed
      ansible.builtin.set_fact:
        k_nginx_degisti: "{{ kd_nginx_site is changed or kd_nginx_bag is changed or kd_nginx_varsayilan is changed }}"
    # restart: port üzerinde istenenden farklı adres dinleniyor, ya da yapılandırma aynı olduğu halde istenen adres dinlenmiyor. Yalnız port değişiyorsa reload yeter.
    - name: Decide whether a restart is needed
      ansible.builtin.set_fact:
        k_nginx_yeniden: >-
          {{ kurulum_nginx_dinleme.stdout_lines != [k_bind ~ ':' ~ k_port]
             and (kurulum_nginx_dinleme.stdout_lines | length > 0 or not k_nginx_degisti | bool) }}
    - name: Reload nginx after a configuration change
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      when: not ansible_check_mode and k_nginx_degisti | bool and not k_nginx_yeniden | bool
      register: kd_nginx_yenile
    # --check'te de koşar (değiştirmeden "changed" der): önizleme, dosya aynı olsa bile adres farkını gösterir
    - name: Restart nginx to apply the listen address
      ansible.builtin.systemd:
        name: nginx
        state: restarted
      when: k_nginx_yeniden | bool
      register: kd_nginx_adres
    - name: Wait for nginx to listen on the requested address
      ansible.builtin.shell: |
        set -o pipefail
        for _ in $(seq 1 20); do
            d=$(ss -ltnpH | awk '/"nginx"/ {print $4}' | { grep -E ':{{ k_port }}$' || true; } | sort -u | tr '\n' ' ')
            [ "$d" = "{{ k_bind }}:{{ k_port }} " ] && break
            sleep 0.5
        done
        echo "$d"
      args:
        executable: /bin/bash
      register: kurulum_nginx_dogrula
      changed_when: false
      when: not ansible_check_mode
    - name: Fail when the requested listen address is not in effect
      ansible.builtin.assert:
        that: kurulum_nginx_dogrula.stdout | trim == k_bind ~ ':' ~ k_port
        fail_msg: >-
          kurulum: nginx için istenen dinleme adresi uygulanamadı. İstenen: {{ k_bind }}:{{ k_port }}; dinlenen: {{ kurulum_nginx_dogrula.stdout | trim or '(yok)' }}.
          Servis dışarıya açık kalmış olabilir. Aynı portu kullanan başka bir nginx sitesi olup olmadığına (/etc/nginx) ve `sudo journalctl -u nginx` çıktısına bakın.
        quiet: true
      when: not ansible_check_mode
    - name: Connection keys
      ansible.builtin.include_role:
        name: env_dosyalari
        tasks_from: ortak
      when: not (ansible_check_mode and kurulum_ana_durum == 'yeni')
    - name: Record in the marker
      ansible.builtin.include_role:
        name: ana_klasor
        tasks_from: isaret_yaz
      vars:
        k_kayit: { mod: native, surum: dagitim, port: "{{ k_port | int }}", bind: "{{ k_bind }}", erisim: "{{ k_erisim }}", veri_yolu: "{{ k_katalog.native_veri }}" }
