# Salt okunur Redis durumu: yalnız ana klasör işareti ve Redis okunur (genel özet: kurulum_durum). Hiçbir şey değiştirmez. İşaret dosyası 0640 root olduğundan sudo ister.
# Sonuç satırı: SSHPOCKET_RESULT utility.redis_durum ana_durum=… redis_kurulu=evet|durmus|hayir|unknown redis_mod=… redis_port=<N>|ic|yok|unknown redis_surum=<etiket>|dagitim|yok|unknown redis_erisim=ic|sunucu|agdan|yok|unknown
- name: redis durum (salt okunur)
  hosts: utility
  gather_facts: true
  gather_subset: [min, date_time]
  become: true
  vars_files:
    - ../roles/ortak/defaults/main.yml
  vars:
    kurulum_islem: durum
    # ön kontrol kurulum değişkenlerine (kurulum_yazilim, özel imaj) bağlı olmasın: yazılım türetmesi atlanır
    k_sabit_yz: docker
    k_d_yz: redis
  tasks:
    - name: Read redis
      ansible.builtin.include_role: {name: ortak, tasks_from: uygulama_oku}
    - name: Result line
      ansible.builtin.debug:
        msg: >-
          SSHPOCKET_RESULT utility.redis_durum ana_durum={{ kurulum_ana_durum }}
          redis_kurulu={{ k_st.redis.kurulu | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          redis_mod={{ k_st.redis.mod | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          redis_port={{ k_st.redis.port | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          redis_surum={{ k_st.redis.surum | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          redis_erisim={{ k_st.redis.erisim | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
