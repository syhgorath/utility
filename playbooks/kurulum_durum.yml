# Salt okunur durum: ana klasör, Docker, kurulu yazılımlar ve portlar. Hiçbir şey değiştirmez. İşaret dosyası 0640 root olduğundan sudo ister.
# Genel özet; uygulama ayrıntıları (mod, port, sürüm, erişim) <uyg>_durum eylemlerindedir. kurulu ve portlar değerleri 64 karakterde KESİLİR (README "Sonuç satırı sınırı").
# Sonuç satırı: SSHPOCKET_RESULT utility.kurulum_durum ana_durum=… docker=… kurulu=… portlar=… nginx_kurulu=… mariadb_kurulu=… redis_kurulu=… proxy_kurulu=… redisui_kurulu=… docker_kurulu=evet|durmus|hayir|unknown docker_servis=evet|durmus|yok|unknown
- name: kurulum durum (salt okunur)
  hosts: utility
  gather_facts: true
  gather_subset: [min, date_time]
  become: true
  vars_files:
    - ../roles/ortak/defaults/main.yml
  vars:
    kurulum_islem: durum
  tasks:
    - name: Preflight
      ansible.builtin.include_role: {name: ortak, tasks_from: preflight}
    - name: Ana klasör
      ansible.builtin.include_role: {name: ana_klasor, tasks_from: kontrol}
    - name: Docker
      ansible.builtin.include_role: {name: docker_kontrol}
    - name: Listening ports
      ansible.builtin.include_role: {name: port_kaydi, tasks_from: durum}
    - name: Applications (actual server state)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/ortak/tasks/uygulama_durum.yml"
      loop: [nginx, mariadb, redis, proxy, redisui]
      loop_control:
        loop_var: k_d_yz
    - name: Docker service
      ansible.builtin.include_role: {name: ortak, tasks_from: docker_servis}
    - name: Human-readable status
      ansible.builtin.debug:
        msg:
          - "ana klasör (sunucu): {{ k_ana_sunucu or '(yok)' }}; istenen: {{ k_ana }}; durum: {{ kurulum_ana_durum }}"
          - "docker: {{ kurulum_docker_durum }} (compose: {{ kurulum_docker_compose }})"
          - "kurulu: {{ k_isaret.yazilimlar | default({}) | dict2items | map(attribute='key') | list | join(', ') or '(yok)' }}"
          - "{{ k_durum_satirlari }}"
          - "docker hizmeti: {{ k_docker_servis }}"
          - >-
            {% for ad, d in k_st.items() %}{{ ad }} (sunucudan okunan): kurulu={{ d.kurulu }} mod={{ d.mod }} port={{ d.port }} sürüm={{ d.surum }}{{ ' (paket ' ~ d.paket ~ ')' if d.paket else '' }} erişim={{ d.erisim }}; {% endfor %}
    - name: Result line
      ansible.builtin.debug:
        msg: >-
          SSHPOCKET_RESULT utility.kurulum_durum ana_durum={{ kurulum_ana_durum }} docker={{ kurulum_docker_durum }}
          kurulu={{ k_kurulu_ozet | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          portlar={{ k_port_ozet | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          nginx_kurulu={{ k_st.nginx.kurulu | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          mariadb_kurulu={{ k_st.mariadb.kurulu | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          redis_kurulu={{ k_st.redis.kurulu | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          proxy_kurulu={{ k_st.proxy.kurulu | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          redisui_kurulu={{ k_st.redisui.kurulu | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          docker_kurulu={{ k_docker_kurulu }}
          docker_servis={{ k_docker_servis }}
