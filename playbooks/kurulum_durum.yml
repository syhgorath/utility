# Salt okunur durum: ana klasör, Docker, kurulu yazılımlar ve portlar. Hiçbir şey değiştirmez. İşaret dosyası 0640 root olduğundan sudo ister.
# Sonuç satırı: SSHPOCKET_RESULT utility.kurulum_durum ana_durum=… docker=… kurulu=… portlar=… <uyg>_kurulu=evet|durmus|hayir|unknown <uyg>_mod=… <uyg>_port=<N>|ic|yok|unknown <uyg>_surum=<etiket>|dagitim|yok <uyg>_erisim=ic|sunucu|agdan|yok|unknown (uyg: nginx, mariadb, redis) docker_servis=evet|durmus|yok|unknown
- name: kurulum durum (salt okunur)
  hosts: utility
  gather_facts: true
  gather_subset: [min, date_time]
  become: true
  vars_files:
    - ../roles/ortak/defaults/main.yml
  vars:
    kurulum_islem: durum
  tasks:
    - name: Preflight
      ansible.builtin.include_role: {name: ortak, tasks_from: preflight}
    - name: Ana klasör
      ansible.builtin.include_role: {name: ana_klasor, tasks_from: kontrol}
    - name: Docker
      ansible.builtin.include_role: {name: docker_kontrol}
    - name: Listening ports
      ansible.builtin.include_role: {name: port_kaydi, tasks_from: durum}
    - name: Applications (actual server state)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../roles/ortak/tasks/uygulama_durum.yml"
      loop: [nginx, mariadb, redis]
      loop_control:
        loop_var: k_d_yz
    - name: Docker service state
      ansible.builtin.command: systemctl is-active docker
      register: kurulum_docker_birim
      changed_when: false
      failed_when: false
      check_mode: false
    # snap / paket dışı Docker'ın birimi bilinmez: unknown
    - name: Docker service summary
      ansible.builtin.set_fact:
        k_docker_servis: >-
          {{ 'yok' if kurulum_docker_durum == 'yok'
             else (('evet' if kurulum_docker_birim.stdout | trim == 'active' else 'durmus') if kurulum_docker_durum in ['resmi', 'dagitim'] else 'unknown') }}
    - name: Human-readable status
      ansible.builtin.debug:
        msg:
          - "ana klasör (sunucu): {{ k_ana_sunucu or '(yok)' }}; istenen: {{ k_ana }}; durum: {{ kurulum_ana_durum }}"
          - "docker: {{ kurulum_docker_durum }} (compose: {{ kurulum_docker_compose }})"
          - "kurulu: {{ k_isaret.yazilimlar | default({}) | dict2items | map(attribute='key') | list | join(', ') or '(yok)' }}"
          - "{{ k_durum_satirlari }}"
          - "docker hizmeti: {{ k_docker_servis }}"
          - >-
            {% for ad, d in k_st.items() %}{{ ad }} (sunucudan okunan): kurulu={{ d.kurulu }} mod={{ d.mod }} port={{ d.port }} sürüm={{ d.surum }}{{ ' (paket ' ~ d.paket ~ ')' if d.paket else '' }} erişim={{ d.erisim }}; {% endfor %}
    - name: Result line
      ansible.builtin.debug:
        msg: >-
          SSHPOCKET_RESULT utility.kurulum_durum ana_durum={{ kurulum_ana_durum }} docker={{ kurulum_docker_durum }}
          kurulu={{ k_kurulu_ozet | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          portlar={{ k_port_ozet | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          nginx_kurulu={{ k_st.nginx.kurulu | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          nginx_mod={{ k_st.nginx.mod | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          nginx_port={{ k_st.nginx.port | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          nginx_surum={{ k_st.nginx.surum | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          nginx_erisim={{ k_st.nginx.erisim | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          mariadb_kurulu={{ k_st.mariadb.kurulu | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          mariadb_mod={{ k_st.mariadb.mod | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          mariadb_port={{ k_st.mariadb.port | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          mariadb_surum={{ k_st.mariadb.surum | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          mariadb_erisim={{ k_st.mariadb.erisim | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          redis_kurulu={{ k_st.redis.kurulu | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          redis_mod={{ k_st.redis.mod | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          redis_port={{ k_st.redis.port | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          redis_surum={{ k_st.redis.surum | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          redis_erisim={{ k_st.redis.erisim | string | regex_replace('[^A-Za-z0-9_.:+-]', '_') | truncate(64, True, '') }}
          docker_servis={{ k_docker_servis }}
