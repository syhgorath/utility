name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sozlesme:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: "Sözleşme uyum denetimi (vendored sshpocket doğrulayıcısı; --strict: uyarı da hata)"
        run: python3 -I tools/validate/component_validate.py . --strict --unsigned
      - name: Tutarlılık (VERSION, CHANGELOG, README, profiller, değişkenler, sonuç satırları)
        run: python3 -I scripts/check-consistency.py
      - name: Vendored doğrulayıcı özetleri VENDORED.md ile aynı mı (sessiz sapma yok)
        run: |
          set -eu
          for f in component_validate.py component_manifest.py; do
            want=$(grep -F "\`$f\`" tools/validate/VENDORED.md | grep -o '[0-9a-f]\{64\}')
            have=$(sha256sum "tools/validate/$f" | cut -d' ' -f1)
            [ "$want" = "$have" ] || { echo "SAPMA: $f (VENDORED.md'deki özet ile eşleşmiyor)"; exit 1; }
          done
      - name: Betikler (bash -n + shellcheck)
        run: |
          set -eu
          for f in scripts/*.sh test/*.sh test/e2e/lab/*.sh; do bash -n "$f"; done
          shellcheck scripts/*.sh test/e2e/lab/*.sh
      - name: Playbook sözdizimi (ansible-core, hash'li kurulum)
        run: |
          set -eu
          python3 -m venv .venv
          .venv/bin/pip install --quiet --require-hashes --only-binary :all: -r requirements.txt
          for p in durum preview apply geri_yukle; do .venv/bin/ansible-playbook --syntax-check -i test/inventory-local.yml "playbooks/$p.yml"; done
      - name: Hızlı testler (yedek betiği birim testleri, release betikleri)
        run: |
          set -eu
          sudo apt-get install -y --no-install-recommends bats >/dev/null
          bats test/backup.bats test/clock.bats
          bash test/test_release_script.sh
          bash test/test_release_publish.sh
