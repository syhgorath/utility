[defaults]
# sshpocket paket kökünde çalıştırır; ayarlar buradan okunur. Host key doğrulaması sshpocket tarafından ZORLANIR (kapatmayın).
interpreter_python = auto_silent
retry_files_enabled = False
deprecation_warnings = False
nocows = True
roles_path = roles
# ansible-core 2.24'te varsayılan False olacak: fact'ler yalnızca ansible_facts[...] ile okunur. Şimdiden zorla.
inject_facts_as_vars = False
result_format = yaml
